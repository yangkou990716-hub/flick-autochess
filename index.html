<style id="ux-style">
.ultbtn{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:5;padding:10px 18px;min-width:132px;font-size:19px;font-weight:900;line-height:1.15;border-radius:16px;background:linear-gradient(180deg,#6a4e12,#2e2206);border:2px solid #ffd54f;color:#ffe9a3;box-shadow:inset 0 1px 0 #fff5,0 3px 0 #1a1200,0 0 16px #ffd54f99;animation:ultPulse 1.1s ease-in-out infinite;text-shadow:0 1px 2px #000}
.ultbtn small{display:block;font-size:10.5px;font-weight:600;color:#ffe9a3cc;margin-top:2px}
.ultbtn.on{background:#ffd54f;color:#2a2000;text-shadow:none;box-shadow:0 0 26px #ffd54f,0 0 0 4px #ffd54f55;animation:none}
.ultbtn.on small{color:#4a3800}
.ultbtn:not(.hidden)~#uxBinfo{bottom:calc(env(safe-area-inset-bottom) + 82px)}
@keyframes ultPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
/* 戰鬥 HUD 動數條 */
.ux-hl{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ux-mvs{display:flex;flex-direction:column;gap:3px;margin-top:4px;max-width:250px}
.ux-mv{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.8}
.ux-mv.cur{opacity:1}.ux-mv.cur .l::before{content:'▶';font-size:9px;margin-right:2px}
.ux-mv .l{width:42px;text-align:right;font-weight:800}
.ux-mvb{flex:1;height:9px;border-radius:5px;background:#0008;border:1px solid #fff3;overflow:hidden}
.ux-mvb i{display:block;height:100%;border-radius:4px;transition:width .3s}
.ux-mv .n{width:38px;font-variant-numeric:tabular-nums;font-weight:800}
.ux-rd{font-size:12px;margin-top:3px;color:#ddd}.ux-rd b{color:#ffe066}
/* 操作體驗（main.js）：拖曳、長按、教學、戰鬥資訊、加速 */
.slot,.card{touch-action:none;-webkit-touch-callout:none}
.card{position:relative}
.ux-ghost{position:fixed;z-index:40;pointer-events:none;opacity:.9;transform:scale(1.1);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:#fff;text-shadow:0 1px 2px #000;box-shadow:0 6px 16px #000a}
.ux-ghost .u{border-color:#ffc531}
.ux-detail{text-align:left;font-size:13px;line-height:1.55}.ux-detail .k{color:#ffc531}
#uxTut{position:fixed;inset:0;z-index:50}
#uxRing{position:absolute;border:2px solid #ffd54f;border-radius:12px;box-shadow:0 0 0 9999px #020812c4,0 0 14px #ffd54f;transition:all .2s;pointer-events:none}
#uxBubble{position:absolute;left:12px;right:12px;margin:0 auto;max-width:360px;background:linear-gradient(180deg,#17355c,#0d203d);border:1px solid #ffd54f;border-radius:14px;box-shadow:0 10px 26px #000a,inset 0 1px 0 #fff3;padding:12px 14px;font-size:14px;line-height:1.55}
#uxBubble .n{font-size:11px;color:#8fb0cc}
#uxBubble .bt{display:flex;gap:8px;margin-top:8px}#uxBubble .bt button{flex:1;padding:8px}
.bhud{right:108px}
.ux-speed{position:absolute;top:calc(env(safe-area-inset-top) + 6px);right:54px;padding:6px 9px;min-width:44px}
.ux-speed.on{background:linear-gradient(180deg,#ffe27a,#f2b522 60%,#c88a00);color:#3a2600;text-shadow:none}
#uxBinfo{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(180deg,#17355cf2,#0b1b34f2);border:1px solid #3d74ad;border-radius:14px;box-shadow:0 6px 18px #0009,inset 0 1px 0 #fff3;padding:8px 11px;font-size:13px;line-height:1.5;pointer-events:none}
#uxBinfo b{font-size:15px}#uxBinfo .k{color:#ffc531}
</style>
<style id="net-style">
/* 連線對戰（src/online.js）：和主畫面同一套泳池浮板語言 */
#net{align-items:center;justify-content:center}
.netbox{width:min(92vw,360px);display:flex;flex-direction:column;gap:11px;text-align:center;padding:18px 16px;border-radius:20px;background:linear-gradient(180deg,#17355c 0%,#0f2443 45%,#0b1b34 100%);border:1px solid #3d74ad;box-shadow:0 14px 34px #000c,inset 0 1px 0 #ffffff30;animation:boxIn .26s cubic-bezier(.2,1.4,.5,1)}
.netbox h2{margin:0;font-weight:900;text-shadow:0 2px 0 #0008}
.netcode{display:inline-block;font-size:32px;letter-spacing:6px;padding:0 10px;border-radius:12px;color:#3a2600;background:linear-gradient(180deg,#fff3a8,#ffc531 60%,#d68a00);box-shadow:inset 0 1px 0 #fff,0 3px 0 #7a5200;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 #fff8}
.nethint{font-size:13px;color:#a9c4dc;line-height:1.55;margin:0}
.netwarn{color:#ff8a7a;font-weight:bold;margin:0}
.netrow{display:flex;gap:8px;align-items:center;justify-content:center;color:#bfeaff;font-weight:700}
.netrow input,#netName{font:inherit;flex:1;min-width:0;padding:10px;border-radius:12px;border:1px solid #2f5f92;background:#081428;color:#fff;box-shadow:inset 0 2px 4px #0008;user-select:text;-webkit-user-select:text}
.netrow input:focus,#netName:focus{outline:2px solid #39c6ff;outline-offset:1px}
#netCode{font-size:20px;letter-spacing:4px;text-align:center}
.netbox button.big{width:100%}
.netplayers{display:flex;flex-direction:column;gap:7px}
.netp{border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;font-size:15px;font-weight:700;background:linear-gradient(180deg,#1b3c66,#132c4f);border:2px solid #2f5f92;box-shadow:inset 0 1px 0 #fff2,0 3px 0 #06142a}
.netp.me{border-color:#39c6ff;box-shadow:inset 0 1px 0 #fff2,0 3px 0 #06142a,0 0 12px #39c6ff44}
.netp.wait{color:#7d9bb8;justify-content:center;border-style:dashed;background:#0a1a33;animation:waitPulse 1.6s ease-in-out infinite}
@keyframes waitPulse{50%{opacity:.55}}
.netp span{font-size:13px;color:#cfe;font-weight:500}
#netb{padding:0}
#netcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.nethud{right:56px;font-size:13px;line-height:1.45}
.neton{color:#7cf05a}.netoff{color:#ff8a7a;font-weight:bold}
.netover{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,330px);background:linear-gradient(180deg,#17355c,#0b1b34);border:1px solid #3d74ad;border-radius:18px;padding:16px;text-align:center;z-index:5;box-shadow:0 14px 34px #000c,inset 0 1px 0 #fff3}
.netover h2{margin:0 0 8px}.netover button{width:100%;margin-top:8px}
/* 連線自走棋（src/league.js） */
#lg{align-items:center;justify-content:center}
#lgb{padding:0}
#lgcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.lgbar{background:#2a2442;border:1px solid #5a548f;border-radius:10px;padding:5px 8px;font-size:12.5px;line-height:1.45;margin-bottom:4px}
.lgbar .lghp{display:flex;flex-wrap:wrap;gap:4px 8px}.lgbar .lghp span{color:#ddd}.lgbar .lghp .me{color:#5cf;font-weight:bold}.lgbar .lghp .out{color:#777;text-decoration:line-through}
.lgbar .lgres{color:#ccc}.lgwarn{color:#ff8a7a}
.lgspec{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);z-index:4;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;background:#0b1b34dd;border:1px solid #3d74ad;border-radius:14px;padding:6px 8px;font-size:13px}
.lgspec button{padding:6px 10px;font-size:13px;margin:0}.lgspec button.on{border-color:#ffd54f;color:#ffe066}
#lgTakeUrl{width:100%;font-size:12px;margin-top:6px}
.netp.lgout{opacity:.55}
#lgOver button{width:100%;margin-top:6px}
</style>
</head>
<body>
<div id="app">
  <section id="title" class="screen">
    <canvas id="titleFx"></canvas>
    <h1 aria-label="彈射自走棋"><span class="lg" style="--i:0">彈</span><span class="lg" style="--i:1">射</span><span class="lg" style="--i:2">自</span><span class="lg" style="--i:3">走</span><span class="lg" style="--i:4">棋</span></h1>
    <p class="sub">經營商店・彈射碰撞・連鎖爆炸</p>
    <button id="btnCont" class="big hidden">繼續遊戲</button>
    <button id="btnNew" class="big">單人新遊戲</button>
    <button id="btnHot" class="big">同手機輪流（2～4 人）</button>
    <div class="asc">難度 <select id="selAsc"></select></div>
    <div class="row trow"><button id="btnCodex">📖 圖鑑</button><button id="uxTutBtn">📘 教學</button><button id="btnSet">⚙ 設定</button><button id="btnLog">📝 更新紀錄</button></div>
    <p class="hint">按住棋子往反方向拉，放開就彈射</p>
  </section>

  <section id="shop" class="screen hidden">
    <!-- 橫向佈陣畫面（照《貨幣戰爭》配置）：上＝資訊列（左：位面／小隊血量／金幣／等級，右：裝備道具／圖鑑／選單）；
         左＝羈絆面板；中＝前台、後台；右＝情報與詳情；下＝備戰區＋按鈕列（左下等級、中刷新鎖定、右下商店／出發）；商店是底部抽屜 -->
    <header class="hud-top ui-panel">
      <div class="ht-l"><span id="tStage" class="pill stage"></span><span id="tHp" class="pill hp"></span><span id="tGold" class="pill gold"></span><span id="tLv" class="pill lv"></span></div>
      <div class="ht-r"><div id="items" class="items" aria-label="裝備與道具"></div><button id="bCodexIn" class="ic-btn" aria-label="策略圖鑑">📖</button><button id="bMenu" class="ic-btn" aria-label="選單">☰</button><button id="bQuit" class="ic-btn" aria-label="存檔並回標題">🏠</button></div>
    </header>
    <div class="mid">
      <aside id="trPanel" class="trpanel ui-panel"><button id="trFold" class="trfold" aria-label="收合羈絆面板">羈絆</button><div id="traits" class="traits"></div></aside>
      <div class="board">
        <div class="zone zfront"><div class="zl"><span class="zt"><img class="posic gi" src="assets/art/icons/pos-front.png" alt="">前台</span><b id="zfN"></b><span class="zh">上場彈射</span></div><div id="front" class="row grid"></div></div>
        <div class="zone zback"><div class="zl"><span class="zt"><img class="posic gi" src="assets/art/icons/pos-back.png" alt="">後台</span><b id="zbN"></b><span class="zh">每回合被動</span></div><div id="back" class="row grid"></div></div>
      </div>
      <aside class="side ui-panel"><div id="enemyInfo" class="enemy"></div><div id="strats" class="traits"></div><div id="info" class="info"></div></aside>
    </div>
    <div class="dock">
      <div class="zone zbench"><div class="zl"><span class="zt">備戰區</span><b id="zcN"></b></div><div id="bench" class="row grid"></div></div>
      <div id="shopDrawer" class="drawer ui-panel">
        <div id="shopHead" class="dr-h"></div>
        <div id="shopRow" class="shoprow"></div>
      </div>
      <div class="ctrls">
        <button id="bXp" class="c-xp">經驗 4</button>
        <div class="c-mid"><button id="bReroll" class="c-re">刷新 2</button><button id="bLock" class="c-lock">鎖定</button></div>
        <div class="c-r"><button id="bShop" class="c-shop" aria-label="商店">商店</button><button id="bFight" class="go c-go">出發 ▶</button></div>
      </div>
    </div>
    <div id="shopMenu" class="shopmenu ui-panel hidden"><button id="bExport">📤 匯出隊伍代碼</button><button id="bDuel">⚔ 代碼對戰</button><button id="bSetIn">⚙ 設定</button><button id="bMenuX">關閉</button></div>
  </section>

  <section id="battle" class="screen hidden">
    <canvas id="cv"></canvas>
    <div id="bhud" class="bhud"></div>
    <button id="uxSpeed" class="ux-speed" aria-label="播放速度">1x</button>
    <button id="bPause" class="pausebtn" aria-label="暫停"></button>
    <button id="bUlt" class="ultbtn hidden">大招</button>
    <div id="uxBinfo" class="hidden"></div>
  </section>

  <div id="uxSell" class="hidden"><div class="sz l">出售</div><div class="sz r">出售</div></div>
  <div id="uxTut" class="hidden"><div id="uxRing"></div><div id="uxBubble" role="dialog" aria-live="polite"></div></div>
  <div id="modal" class="modal hidden"><div id="modalBox" class="box"></div></div>
</div>
<script src="data/config.js"></script>
<script src="data/units.js"></script>
<script src="data/traits.js"></script>
<script src="data/items.js"></script>
<script src="data/enemies.js"></script>
<script src="data/run.js"></script>
<script src="data/league.js"></script>
<script src="src/core/battle.js"></script>
<script src="src/core/ai.js"></script>
<script src="src/core/run.js"></script>
<script src="src/core/league.js"></script>
<script src="vendor/zzfx.js"></script>
<script src="src/ui/sound.js"></script>
<script src="vendor/tabler-icons.js"></script>
<script src="src/ui/sprites.js"></script>
<script src="src/ui/sprites_new.js"></script>
<script src="src/ui/sprites_r8.js"></script>
<script src="src/ui/render.js"></script>
<script src="src/ui/icons.js"></script>
<script src="src/main.js"></script>
<script src="src/ui/settings.js"></script>
<script src="src/ui/title.js"></script>
<script src="src/ui/mobile.js"></script>
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-database-compat.js"></script>
<script src="data/netconfig.js"></script>
<script src="src/online.js"></script>
<script src="src/league.js"></script>
</body>
</html>
