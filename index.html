<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14121f">
<title>彈射自走棋</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
<style id="ux-style">
.ultbtn{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:5;padding:10px 18px;min-width:132px;font-size:19px;font-weight:900;line-height:1.15;border-radius:16px;background:linear-gradient(180deg,#5a4210,#2e2206);border:2px solid #ffd54f;color:#ffe9a3;box-shadow:0 0 12px #ffd54f88;animation:ultPulse 1.1s ease-in-out infinite;text-shadow:0 1px 2px #000}
.ultbtn small{display:block;font-size:10.5px;font-weight:600;color:#ffe9a3cc;margin-top:2px}
.ultbtn.on{background:#ffd54f;color:#2a2000;text-shadow:none;box-shadow:0 0 26px #ffd54f,0 0 0 4px #ffd54f55;animation:none}
.ultbtn.on small{color:#4a3800}
.ultbtn:not(.hidden)~#uxBinfo{bottom:calc(env(safe-area-inset-bottom) + 82px)}
@keyframes ultPulse{0%,100%{transform:scale(1);box-shadow:0 0 10px #ffd54f88}50%{transform:scale(1.06);box-shadow:0 0 22px #ffd54f}}
/* 戰鬥 HUD 動數條 */
.ux-hl{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ux-mvs{display:flex;flex-direction:column;gap:3px;margin-top:4px;max-width:250px}
.ux-mv{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.8}
.ux-mv.cur{opacity:1}.ux-mv.cur .l::before{content:'▶';font-size:9px;margin-right:2px}
.ux-mv .l{width:42px;text-align:right;font-weight:800}
.ux-mvb{flex:1;height:9px;border-radius:5px;background:#0008;border:1px solid #fff3;overflow:hidden}
.ux-mvb i{display:block;height:100%;border-radius:4px;transition:width .3s}
.ux-mv .n{width:38px;font-variant-numeric:tabular-nums;font-weight:800}
.ux-rd{font-size:12px;margin-top:3px;color:#ddd}.ux-rd b{color:#ffe066}
/* 操作體驗（main.js）：拖曳、長按、教學、戰鬥資訊、加速 */
.slot,.card{touch-action:none;-webkit-touch-callout:none}
.card{position:relative}
.card .ux-own{font-size:10px;color:#9df;line-height:1.2}
.card .ux-own.up{color:#ffe066;font-weight:bold}
.card .ux-syn{font-size:9.5px;color:#111;background:#7cf05a;border-radius:6px;margin:1px 2px 0;line-height:1.3}
.card .ux-syn.near{background:#3a3658;color:#cfc}
.ux-dragging .slot:not(.lock){border-color:#ffc531;border-style:solid}
.slot.ux-over,.row.ux-over{box-shadow:0 0 0 3px #7cf05a}
.ux-ghost{position:fixed;z-index:40;pointer-events:none;width:56px;height:56px;margin:-28px 0 0 -28px;opacity:.9;transform:scale(1.1);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:#fff;text-shadow:0 1px 2px #000;box-shadow:0 6px 16px #000a}
.ux-ghost .u{border-color:#ffc531}
#uxSell{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);z-index:35;height:64px;border-radius:14px;border:2px dashed #ff7a5a;background:#3a1a1aee;color:#fbb;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:bold}
#uxSell.ux-over{background:#a0302aee;color:#fff;border-style:solid}
.ux-detail{text-align:left;font-size:13px;line-height:1.55}.ux-detail .k{color:#ffc531}
#uxTut{position:fixed;inset:0;z-index:50}
#uxRing{position:absolute;border:2px solid #ffc531;border-radius:12px;box-shadow:0 0 0 9999px #000b;transition:all .2s;pointer-events:none}
#uxBubble{position:absolute;left:12px;right:12px;margin:0 auto;max-width:360px;background:#2d2a45;border:1px solid #ffc531;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55}
#uxBubble .n{font-size:11px;color:#aaa}
#uxBubble .bt{display:flex;gap:8px;margin-top:8px}#uxBubble .bt button{flex:1;padding:8px}
.bhud{right:108px}
.ux-speed{position:absolute;top:calc(env(safe-area-inset-top) + 6px);right:54px;padding:6px 9px;min-width:44px}
.ux-speed.on{background:#6b5a1a;border-color:#ffc531}
#uxBinfo{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);background:#1d1a2eee;border:1px solid #4a4670;border-radius:12px;padding:8px 11px;font-size:13px;line-height:1.5;pointer-events:none}
#uxBinfo b{font-size:15px}#uxBinfo .k{color:#ffc531}
.ux-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.ux-stats div{background:#2a2740;border-radius:10px;padding:6px 4px;font-size:12px;color:#aaa;line-height:1.3}
.ux-stats b{display:block;font-size:20px;color:#ffe066}
.ux-res{font-size:13.5px;line-height:1.6}
</style>
</head>
<body>
<div id="app">
  <section id="title" class="screen">
    <h1>彈射自走棋</h1>
    <p class="sub">經營商店・彈射碰撞・連鎖爆炸</p>
    <button id="btnCont" class="big hidden">繼續遊戲</button>
    <button id="btnNew" class="big">單人新遊戲</button>
    <button id="btnHot" class="big">同手機輪流（2～4 人）</button>
    <div class="asc">難度 <select id="selAsc"></select></div>
    <div class="row" style="gap:8px"><button id="btnCodex">📖 圖鑑</button><button id="btnSound">🔊 音效開</button><button id="uxVib">📳 震動開</button><button id="uxTutBtn">📘 教學</button></div>
    <p class="hint">拖曳己方棋子往反方向拉，放開彈射</p>
  </section>

  <section id="shop" class="screen hidden">
    <div class="top">
      <span id="tStage"></span><span id="tHp"></span><span id="tGold"></span><span id="tLv"></span>
    </div>
    <div id="enemyInfo" class="enemy"></div>
    <div id="strats" class="traits"></div>
    <div id="traits" class="traits"></div>
    <div class="lbl">前台（上場彈射）</div><div id="front" class="row"></div>
    <div class="lbl">後台（每回合被動）</div><div id="back" class="row"></div>
    <div class="lbl">備戰區</div><div id="bench" class="row"></div>
    <div id="items" class="items"></div>
    <div id="info" class="info"></div>
    <div id="shopRow" class="shoprow"></div>
    <div class="ctrls">
      <button id="bReroll">刷新 2</button><button id="bLock">鎖定</button><button id="bXp">經驗 4</button>
      <button id="bFight" class="go">前進 ▶</button>
    </div>
    <div class="ctrls sub2"><button id="bExport">📤 匯出隊伍代碼</button><button id="bDuel">⚔ 代碼對戰</button><button id="bQuit">🏠</button></div>
  </section>

  <section id="battle" class="screen hidden">
    <canvas id="cv"></canvas>
    <div id="bhud" class="bhud"></div>
    <button id="uxSpeed" class="ux-speed">1x</button>
    <button id="bPause" class="pausebtn">⏸</button>
    <button id="bUlt" class="ultbtn hidden">⚡ 大招</button>
    <div id="uxBinfo" class="hidden"></div>
  </section>

  <div id="uxSell" class="hidden">賣出</div>
  <div id="uxTut" class="hidden"><div id="uxRing"></div><div id="uxBubble"></div></div>
  <div id="modal" class="modal hidden"><div id="modalBox" class="box"></div></div>
</div>
<script src="data/config.js"></script>
<script src="data/units.js"></script>
<script src="data/traits.js"></script>
<script src="data/items.js"></script>
<script src="data/enemies.js"></script>
<script src="data/run.js"></script>
<script src="src/core/battle.js"></script>
<script src="src/core/ai.js"></script>
<script src="src/core/run.js"></script>
<script src="src/ui/sound.js"></script>
<script src="src/ui/sprites.js"></script>
<script src="src/ui/render.js"></script>
<script src="src/main.js"></script>
</body>
</html>
